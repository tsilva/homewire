name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +1.95.0 fmt --all --check
      - name: Tests
        run: cargo +1.95.0 test --locked
      - name: Lints
        run: cargo +1.95.0 clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo +1.95.0 build --release --locked

  tv-companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pinned Android toolchain, companion tests and unsigned APK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # These exact SDK packages ship with ubuntu-24.04; build.py verifies them.
          export HOMEWIRE_ANDROID_PLATFORM="$ANDROID_HOME/platforms/android-35"
          export HOMEWIRE_ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          sh companion/tv/test.sh
          python3 -m unittest discover -s companion/tv/tests -p 'test_*.py'
          python3 -m unittest discover -s scripts/android -p 'test_*.py'
          shellcheck companion/tv/build.sh companion/tv/test.sh scripts/android/build.sh scripts/android/sandbox/build.sh scripts/android/sandbox/build-identity.sh
          python3 companion/tv/build.py --unsigned --version 0.1.0
