[package]
name = "homewire"
version = "0.1.0"
edition = "2024"
default-run = "homewire"
rust-version = "1.89"
description = "Lightweight home automation and MCP device control, built in Rust."
license = "MIT"
repository = "https://github.com/tsilva/homewire"

[dependencies]
aes = "=0.8.4"
cipher = "=0.4.4"
crc32fast = "=1.4.2"
sha2 = "=0.10.9"
getrandom = { version = "=0.2.16", features = ["std"] }
ring = "=0.17.14"
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.140"
chrono = { version = "=0.4.40", default-features = false, features = ["now", "std"] }
chrono-tz = "=0.10.3"

base64 = "=0.22.1"
sha1 = "=0.10.7"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.3"
quick-xml = { version = "=0.37.2", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
