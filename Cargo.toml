[package]
name = "homewire"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Lightweight home automation and MCP device control, built in Rust."
license = "MIT"
repository = "https://github.com/tsilva/homewire"

[dependencies]
aes = "=0.8.4"
cipher = "=0.4.4"
crc32fast = "=1.4.2"
sha2 = "=0.10.9"
getrandom = "=0.2.16"
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.140"
chrono = { version = "=0.4.40", default-features = false, features = ["clock", "std"] }
chrono-tz = "=0.10.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[lints.clippy]
unwrap_used = "deny"
