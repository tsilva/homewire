<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homewire</title>
<style>
body{font:16px system-ui;margin:2rem auto;max-width:900px;padding:0 1rem;background:#101a20;color:#e3eced}input,button,select,textarea{font:inherit;padding:.6rem;margin:.25rem;border:1px solid #47616b;border-radius:6px;background:#192c35;color:inherit}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}article{border-top:1px solid #47616b;padding:1rem 0}small{color:#b8cacf}svg{width:100%;height:180px}a{color:#79d6c4}label{display:block}#login input{width:75%}nav{display:flex;flex-wrap:wrap;gap:.3rem}h2{font-size:19px}textarea{width:90%;height:100px}button:disabled{opacity:.5}
</style>
<h1>Homewire</h1><p>Devices, routines, alerts and household data.</p>
<form id="login"><label>Dashboard token <input id="token" type="password" autocomplete="off" required></label><button>Connect</button></form>
<p id="message" role="status"></p>
<main id="content" hidden><nav><button onclick="devices()">Devices</button><button onclick="routines()">Routines</button><button onclick="alerts()">Alerts</button><button onclick="shopping()">Shopping</button><button onclick="weather()">Weather</button><button onclick="history()">History / energy</button><button onclick="assistant()">Assistant</button></nav><section id="view"></section></main>
<script>
let secret='';
const view=document.querySelector('#view'),message=document.querySelector('#message');
function node(tag,text,parent=view){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
function fail(e){message.textContent=e.message}
async function request(path,data){const r=await fetch(path,{method:'POST',headers:{Authorization:'Bearer '+secret,'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok||j.error)throw Error(j.error?.message||'Request failed');return j.result}
async function call(name,arguments={}){return request('/api/call',{name,arguments})}
function button(label,parent,action){const b=node('button',label,parent);b.onclick=async()=>{b.disabled=true;try{await action()}catch(e){fail(e)}finally{b.disabled=false}};return b}
function output(parent,result){const pre=parent.querySelector('pre')||node('pre','',parent);pre.textContent=JSON.stringify(result,null,2)}
document.querySelector('#login').onsubmit=async e=>{e.preventDefault();secret=document.querySelector('#token').value;document.querySelector('#token').value='';try{await call('entity_list');document.querySelector('#login').hidden=true;document.querySelector('#content').hidden=false;message.textContent='Connected';await devices()}catch(e){fail(e)}};
async function catalog(filter={}){let all=[],offset=0;do{const p=await call('entity_list',{...filter,offset,limit:8});all.push(...p.entities);offset=p.next_offset}while(offset!==null);return all}
async function devices(){view.replaceChildren();try{const all=await catalog(),groups=new Map();for(const e of all){if(!groups.has(e.device))groups.set(e.device,[]);groups.get(e.device).push(e)}for(const group of groups.values()){const e=group.find(x=>x.domain!=='sensor')||group[0],a=node('article','');node('h2',e.entity,a);node('small',e.model+' · '+group.length+' entities',a);button('Read',a,async()=>{const r=await call('entity_status',{entities:[e.entity]});output(a,r.states[0]);const loc=r.states[0].state?.location;if(loc&&!a.querySelector('a')){const link=node('a','Open location in map',a);link.href='https://www.openstreetmap.org/?mlat='+loc.latitude+'&mlon='+loc.longitude+'#map=16/'+loc.latitude+'/'+loc.longitude;link.rel='noreferrer';link.target='_blank'}});
button('Controls / settings',a,async()=>{let d=null,offset=0;do{const p=await call('entity_list',{device:e.device,details:true,offset,limit:1});d=p.entities.find(x=>x.entity===e.entity);offset=p.next_offset}while(!d&&offset!==null);if(!d)return;const c=d.capabilities;const panel=a.querySelector('.controls')||node('div','',a);panel.className='controls';panel.replaceChildren();if(e.power_owner)node('p','Power is managed by '+e.power_owner+'. Use Routines.',panel);
if(c.power){for(const power of [true,false])button(power?'On':'Off',panel,async()=>{const tool=e.domain==='light'?'light_set':e.domain==='switch'?'switch_set':'media_power',args=e.domain==='light'?{entity:e.entity,settings:{power}}:{entity:e.entity,power};output(a,await call(tool,args))})}
if(c.brightness_percent){const n=node('input','',panel);n.type='number';n.min=1;n.max=100;n.placeholder='Brightness %';button('Set brightness',panel,async()=>output(a,await call('light_set',{entity:e.entity,settings:{brightness_percent:Number(n.value)}})))}
if(c.remote_keys){const keys=node('select','',panel);for(const k of c.remote_keys)node('option',k,keys).value=k;button('Send key',panel,async()=>output(a,await call('remote_key',{entity:e.entity,key:keys.value})))}
if(c.play_url){const u=node('input','',panel);u.placeholder='Media URL';const type=node('input','',panel);type.placeholder='Content type';type.value='audio/mpeg';button('Play URL',panel,async()=>output(a,await call('media_play',{entity:e.entity,media:{url:u.value,content_type:type.value}})));for(const action of ['play','pause','stop'])button(action,panel,async()=>output(a,await call('media_command',{entity:e.entity,command:{action}})))}
if(c.settings){output(panel,c.settings);const input=node('textarea','',panel);input.placeholder='Settings JSON';button('Apply settings',panel,async()=>output(a,await call('entity_configure',{entity:e.entity,settings:JSON.parse(input.value)})));button('Live options',panel,async()=>output(a,await call('entity_options',{entity:e.entity})))}
if(Object.keys(c).length===1)node('p','Read-only device.',panel);
});}}catch(e){fail(e)}}
async function routines(){view.replaceChildren();try{const r=await call('routine_list');for(const item of r.routines||[]){const a=node('article','');const name=item.routine||item.name;node('strong',name,a);node('p',item.description||'',a);button('Run',a,async()=>output(a,await call('routine_run',{routine:name})))}}catch(e){fail(e)}}
async function alerts(){view.replaceChildren();try{const r=await call('alert_list');for(const a of r.alerts||[]){const card=node('article','');node('strong',(a.active?'Active: ':'Recovered: ')+a.title,card);node('p',a.message,card);node('small',new Date(a.updated_at*1000).toLocaleString(),card)}if(!r.alerts?.length)node('p','No home alerts.')}catch(e){fail(e)}}
async function shopping(){view.replaceChildren();try{const r=await call('shopping_list');for(const i of r.items){const row=node('article','');button(i.complete?'✓':'□',row,async()=>{await call('shopping_update',{action:'check',id:i.id,complete:!i.complete});await shopping()});node('span',i.name,row);button('Remove',row,async()=>{await call('shopping_update',{action:'remove',id:i.id});await shopping()})}const input=node('input','');input.placeholder='Item';button('Add',view,async()=>{await call('shopping_update',{action:'add',name:input.value});await shopping()});button('Clear completed',view,async()=>{await call('shopping_update',{action:'clear_completed'});await shopping()})}catch(e){fail(e)}}
async function weather(){view.replaceChildren();try{const w=await call('weather_status');output(view,w)}catch(e){fail(e)}}
async function history(){view.replaceChildren();try{const series=await call('history_series');node('p','Observed readings; daily counter maxima may miss consumption between the final sample and midnight.');const input=node('select','');for(const s of series.entities)node('option',s,input).value=s;const select=node('select','');for(const x of ['raw','hour','day'])node('option',x,select).value=x;button('Load',view,async()=>{const r=await call('history_query',{entity:input.value,aggregation:select.value,limit:96});view.querySelectorAll('svg,pre').forEach(x=>x.remove());output(view,r);const points=r.points||[];if(points.length>1){const vals=points.map(p=>p.value??p.max),min=Math.min(...vals),max=Math.max(...vals),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 800 180');const line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('points',vals.map((v,i)=>(i*800/(vals.length-1))+','+(170-(v-min)*160/(max-min||1))).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#79d6c4');line.setAttribute('stroke-width','2');svg.append(line);view.append(svg)}})}catch(e){fail(e)}}
function assistant(){view.replaceChildren();node('p','Ask the configured ZeroClaw agent. If a request fails, check device state before sending it again.');const input=node('textarea','');input.placeholder='Ask ZeroClaw';button('Send',view,async()=>output(view,await request('/api/assistant',{message:input.value})))}
</script></html>
